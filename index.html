<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Thing Tasks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="One Thing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm column. Tasks sit on a single card with hairline rows. Extras (hints, suggestions, new project form) stay hidden until asked for. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1c2430; --muted:#6b7686; --line:#e8ebf0; --line2:#cdd3dc; --soft:#f0f2f5;
  --accent:#d9541e; --accent-ink:#ffffff;
  --ok:#2f8f5b; --warn:#a96f12; --bad:#c0392b; --info:#2f6fb5;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151c; --surface:#18202a; --ink:#e9edf2; --muted:#8e9aaa; --line:#252e3a; --line2:#3a4656; --soft:#202a36;
    --accent:#ff7a3d; --accent-ink:#1a0e07; --ok:#52c28a; --warn:#e0a94a; --bad:#ff6b5b; --info:#6fa8e8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --ink:#e9edf2; --muted:#8e9aaa; --line:#252e3a; --line2:#3a4656; --soft:#202a36;
  --accent:#ff7a3d; --accent-ink:#1a0e07; --ok:#52c28a; --warn:#e0a94a; --bad:#ff6b5b; --info:#6fa8e8; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{font-family:var(--display);font-weight:700;font-size:19px;padding:0 12px 18px;letter-spacing:-.01em}
.brand i{color:var(--accent);font-style:normal}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;min-height:42px}
.nav:hover{background:var(--soft)}
.nav.on{color:var(--ink);font-weight:600;background:var(--soft)}
.nav.more{display:none}
.badge{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav.on .badge{color:var(--accent);font-weight:600}
.rail .foot{margin-top:auto;padding:14px 12px 0;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px}
.main{overflow:auto;padding:36px clamp(20px,5vw,56px) 56px;max-width:720px;width:100%;margin:0 auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.sub.over{color:var(--bad)}
.hbtns{display:flex;gap:8px;align-items:center;flex:none}
.btn{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 12px;min-height:34px;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--soft);color:var(--ink);border-color:transparent}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn.sm{width:36px;height:36px}
.linkbtn{color:var(--muted);font-weight:500;font-size:14px;padding:10px 4px;min-height:40px}
.linkbtn:hover{color:var(--ink)}
.capture{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px}
.capture:focus-within{border-color:var(--accent)}
.capture textarea{flex:1;border:0;background:transparent;resize:none;outline:none;padding:9px 0;min-height:42px;max-height:160px;font-size:16px;line-height:1.4}
.capture textarea::placeholder{color:var(--muted)}
.capture .go{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.capwrap{margin-bottom:22px}
.hint{display:none;color:var(--muted);font-size:13px;margin:8px 6px 0}
.capwrap.hinting .hint{display:block}
.hint code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:12px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 16px;margin-bottom:16px;color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
ul.list{list-style:none;margin:0;padding:0}
ul.list>li{border-top:1px solid var(--line)}
ul.list>li:first-child{border-top:0}
.task{display:flex;gap:14px;align-items:flex-start;padding:15px 8px 15px 16px}
.task.next-up{box-shadow:inset 3px 0 0 var(--accent)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;position:relative;margin-top:1px}
.check::before{content:"";position:absolute;inset:-10px}
.check:hover{border-color:var(--accent)}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0;cursor:pointer}
.title{font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;margin-top:3px;font-size:13px;color:var(--muted)}
.meta span+span::before{content:"\00b7";margin:0 7px;color:var(--line2)}
.meta .late{color:var(--bad)} .meta .due{color:var(--warn)} .meta .plan,.meta .carry{color:var(--info)}
.side{display:flex;gap:2px;align-items:center;flex:none}
.task.triage{flex-wrap:wrap}
.task.triage .side{width:100%;padding-left:40px;margin-top:-4px}
.mv{display:flex;flex-direction:column}
.mv button{width:40px;height:22px;color:var(--muted);font-size:12px;border-radius:8px}
.mv button:hover{color:var(--ink);background:var(--soft)}
.mv button:active{background:var(--soft)}
.section{font-size:13px;color:var(--muted);margin:30px 4px 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{text-align:center;color:var(--muted);padding:38px 16px}
.card .empty{padding:44px 16px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.fchip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:500;min-height:32px;color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -4px 18px;padding-left:4px}
.day{flex:none;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 8px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:500;position:relative}
.day b{font-size:19px;color:var(--ink);font-family:var(--display);font-weight:700}
.day.on{background:var(--ink);color:var(--bg)}
.day.on b{color:var(--bg)}
.day i{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sug{display:flex;gap:12px;align-items:center;padding:12px 8px 12px 18px}
.sug .title{font-size:15px}
.pcard{padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.pcard:first-child{border-top:0}
.pcard:hover{background:var(--soft)}
.prow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pname{font-family:var(--display);font-weight:600;font-size:18px}
.bar{height:4px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.pmeta{color:var(--muted);font-size:13px}
.newp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.newp textarea{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 14px;min-height:110px;resize:vertical;font-size:16px}
.newp .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.newp .row .btns{margin-left:auto}
.tplrow{display:flex;gap:6px;flex-wrap:wrap}
.tpl{display:inline-flex;align-items:center}
.tpl .x{color:var(--muted);padding:0 8px;font-size:16px}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(8,12,18,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.veil.show{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(520px,100%);max-height:92%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--display);font-size:21px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.fld textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tog{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.tog input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.sheet .acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.whenbig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whenbig .btn{font-size:18px;padding:16px 10px}
.when5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.when5 .btn{padding:8px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;line-height:1.2;color:var(--muted)}
.when5 .btn b{font-size:17px;font-family:var(--display);color:var(--ink)}
.pickrow{display:flex;gap:8px}
.pickrow input{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;justify-content:space-between;padding:16px 4px;border-top:1px solid var(--line);font-size:17px;font-weight:500;text-align:left}
.menu button:first-child{border-top:0}
.menu span{color:var(--muted)}
.ai{display:flex;gap:12px;align-items:flex-start;padding:10px 2px}
.ai input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
/* focus */
.focus{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));overflow:auto}
.focus.show{display:flex}
.ftop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.fmid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;max-width:600px;width:100%;margin:0 auto;padding:16px 0}
.fproj{color:var(--muted);font-weight:600;font-size:14px}
.ftitle{font-family:var(--display);font-size:clamp(28px,6vw,42px);line-height:1.15;font-weight:700;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.fnote{color:var(--muted);white-space:pre-wrap;max-height:20vh;overflow:auto}
.timer{font-family:var(--display);font-size:38px;font-variant-numeric:tabular-nums;color:var(--muted)}
.frow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.fdone{font-size:20px;padding:16px 44px;border-radius:18px;margin:6px 0}
.stuckbox{width:100%;text-align:left}
.smaller{display:flex;gap:8px;width:100%}
.smaller input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(32px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;display:none;gap:14px;align-items:center;z-index:50;max-width:92%;font-size:15px}
.toast.show{display:flex}
.toast{width:max-content;max-width:min(92vw,520px)}
.toast button{color:var(--accent);font-weight:700;white-space:nowrap;padding:6px 0 6px 4px}
.sync{font-size:12px}
.sync b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);margin-right:6px}
.sync.ok b{background:var(--ok)}
/* calendar */
.main.wide{max-width:1180px}
.calbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-6px 0 16px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{padding:7px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pager{display:flex;gap:2px;align-items:center}
.pager .icon-btn{width:38px;height:38px;font-size:20px;line-height:1}
.pager .btn{min-height:36px}
.week{display:flex;flex-direction:column;gap:12px}
.dcol{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 16px 10px;font-weight:600}
.dhead small{color:var(--muted);font-weight:500;font-size:13px}
.dcol.today .dhead span{color:var(--accent)}
.dcol .list>li:first-child{border-top:1px solid var(--line)}
.dadd{display:block;width:100%;text-align:left;padding:10px 16px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);min-height:42px}
.dadd:hover{color:var(--ink);background:var(--soft)}
.dcol .capwrap{margin:0;border-top:1px solid var(--line)}
.dcol .capture{border:0;border-radius:0}
.over-drop{outline:2px dashed var(--accent);outline-offset:-3px}
li.task[draggable="true"]{cursor:grab}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px;margin-bottom:18px}
.month .dow{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 6px;font-weight:600}
.mday{height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:3px;font-weight:600;font-size:15px;position:relative;font-variant-numeric:tabular-nums}
.mday:hover{background:var(--soft)}
.mday.blank{visibility:hidden}
.mday.past{color:var(--muted);font-weight:500}
.mday.today{color:var(--accent)}
.mday.sel{background:var(--ink);color:var(--bg)}
/* In a month cell the only number is the date. Tasks are dots, due is an amber dot, done days get a check. */
.mdots{display:flex;gap:3px;align-items:center;height:8px}
.mdots i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.mdots i.due,.mlegend i.due{width:8px;height:8px;background:transparent;border:2px solid var(--warn);box-sizing:border-box}
.mday.sel .mdots i.due{border-color:var(--warn)}
.mdots b{font-size:10px;line-height:1;font-weight:700;color:var(--muted)}
.mday .ok{font-size:12px;line-height:8px;color:var(--ok);font-weight:700}
.mday.sel .mdots i:not(.due):not(.left){background:var(--bg)}
.mday.sel .mdots b,.mday.sel .ok{color:var(--bg)}
.mlegend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--muted);padding:8px 0 2px}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend i{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block}
.mlegend .ok{color:var(--ok);font-weight:700}
.mdots i.left,.mlegend i.left{background:var(--bad)}
.mday.sel .mdots i.left{background:var(--bad)}
.cnts{display:flex;gap:6px;flex-wrap:wrap}
.cnt.left{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.dsub{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px 8px 16px;font-size:13px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,transparent)}
.dsub.incol{border-top:1px solid var(--line)}
.dsub.plain{color:var(--muted);background:transparent;padding:8px 16px}
.dsub button{font-size:13px;font-weight:700;color:var(--ink);padding:6px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);min-height:32px}
.dsub button:hover{border-color:var(--line2)}
.earlier .list>li:first-child{border-top:1px solid var(--line)}
.meta .carry{color:var(--bad)}
.meta .rem{color:var(--accent);font-weight:600}
.meta .rem.past{color:var(--muted);font-weight:500}
.dcol.past .dhead span{color:var(--muted)}
.cnt{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:99px;padding:2px 9px;white-space:nowrap;font-style:normal}
.dhead .dname small{margin-left:8px;white-space:nowrap}
.trayh{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;font-weight:600;border-top:1px solid var(--line);min-height:50px;text-align:left}
.trayh:first-child{border-top:0}
.trayh span{color:var(--muted);font-weight:500;font-size:14px}
.trayh:hover{background:var(--soft)}
.links{display:flex;gap:4px 16px;flex-wrap:wrap;margin-top:6px}
.banner.wrap{flex-wrap:wrap;color:var(--ink);border-color:var(--accent);padding:10px 10px 10px 16px}
.banner.wrap .btns{margin-left:auto}
.tray .list>li:first-child{border-top:1px solid var(--line)}
.tray .capwrap{margin:0;border-top:1px solid var(--line)}
.tray .capture{border:0;border-radius:0}
@media (min-width:980px){
  .main.wide .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:stretch}
  .main.wide .week .dcol{min-height:240px;display:flex;flex-direction:column}
  .main.wide .week .dcol .list{flex:1}
  .main.wide .week .dhead{flex-direction:column;align-items:flex-start;gap:6px;padding:10px 10px 8px}
  .main.wide .week .dname span{display:block}
  .main.wide .week .dname small{display:block;margin-left:0}
  .main.wide .week .task{padding:9px 6px 9px 9px;gap:8px;font-size:14px}
  .main.wide .week .task .side{display:none}
  .main.wide .week .check{width:20px;height:20px}
  .main.wide{padding-left:28px;padding-right:28px}
  .main.wide .week .meta{font-size:12px;display:block;margin-top:2px}
  .main.wide .week .meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main.wide .week .meta span+span::before{content:none}
  .main.wide .week .meta span:nth-child(n+3){display:none}
  .main.wide .week .title{line-height:1.3}
  .main.wide .week .dadd{padding:8px 10px;font-size:13px;margin-top:auto}
  .main.wide .week .capture{padding:4px 4px 4px 10px}
  .main.wide .week .capture .go{width:32px;height:32px}
  .main.wide .week .hint{display:none!important}
  .main.wide .week .dsub{padding:6px 6px 6px 9px;font-size:12px;flex-wrap:wrap}

<script>
(function(){
"use strict";
var LS="onething.v1";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var pad=function(n){return String(n).padStart(2,"0")};
var ymd=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var todayStr=function(){return ymd(new Date())};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
function addDays(n){ var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return ymd(d); }
function dt(s){ return new Date(s+"T12:00:00"); }
function nextDow(w){ var diff=(w-new Date().getDay()+7)%7; if(diff===0) diff=7; return addDays(diff); }
function dayLabel(d){

}
/* "at 3:45 PM", "tomorrow at 9:00 AM", "Fri, Nov 6 at 9:00 AM" */
function clock(ms){ return new Date(ms).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function remindLabel(ms){

function localInput(ms){ var d=new Date(ms); return ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }
/* For use mid-sentence: "today", "tomorrow", but "Sat, Nov 7" keeps its capitals. */
function dayWord(d){ var l=dayLabel(d); return (l==="Today"||l==="Tomorrow")?l.toLowerCase():l; }
var IC={
  cal:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',

  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
};

var S={tasks:[],projects:[],templates:[],settings:{todayLimit:5},updated:0,gone:{},settingsMod:0};
var view="today", planDay=addDays(1), filt={energy:null}, sync="local", SAMPLE=null, pullOpen=false, newOpen=false;
var VIEWS=[["today","Today"],["cal","Calendar"],["inbox","Inbox"],["projects","Projects"]];
/* Calendar state: week or month, how far paged, the picked day in month view,
   which day has its inline add box open ("later" = the Later tray), which tray groups are open. */
var CAL={mode:"week",week:0,month:0,sel:null,add:null,tray:{any:false,later:false}};
var BUILTIN=[
  {name:"Commissioning visit",steps:["Pack laptop, cables, and tools","Confirm access and permits for the site","Back up the PLC program before touching anything","Verify I/O against the I/O list","Loop check analog inputs","Test alarms and shutdowns","Back up the final program","Write the service report"]},
  {name:"PLC and HMI build",steps:["Collect the I/O list, P&IDs, and control narrative","Set up the project folders","Build tags, UDTs, and AOIs","Write the control logic","Build the HMI screens","Simulate and test offline","Commission on site","Save as-builts and docs"]},
  {name:"Instrument calibration",steps:["Pull the instrument list and ranges","Pack the calibrator and HART communicator","Record as-found values","Calibrate and record as-left values","Update the calibration log"]}
];

/* ---------- persistence ---------- */
var dbDoc=null, saveTimer=null, saving=false, dirty=false;
function norm(r){
  r=r||{}; r.tasks=r.tasks||[]; r.projects=r.projects||[]; r.templates=r.templates||[];
  r.settings=Object.assign({todayLimit:5},r.settings||{}); r.updated=r.updated||0;
  r.tasks.forEach(function(t){
    if(t.plan===undefined){ t.plan=t.today?todayStr():null; }
    delete t.today;
    if(t.mod===undefined) t.mod=t.doneAt||t.created||0;   /* v2: per-item change time for sync merges */
    if(t.remind===undefined) t.remind=null;              /* v3: reminder time (epoch ms) or null */
  });
  r.projects.forEach(function(p){ if(p.mod===undefined) p.mod=0; });
  r.templates.forEach(function(p){ if(p.mod===undefined) p.mod=0; });
  r.gone=r.gone||{}; r.settingsMod=r.settingsMod||0;   /* v2: deleted ids -> time deleted */
  var old=Date.now()-90*864e5;
  Object.keys(r.gone).forEach(function(id){ if(r.gone[id]<old) delete r.gone[id]; });
  return r;
}
/* Change stamps: save() compares each item with its last saved copy, stamps what changed,
   and records deletions, so devices can merge item by item. */
var snap={};
function stripMod(x){ var c=Object.assign({},x); delete c.mod; return JSON.stringify(c); }
function snapAll(){
  snap={settings:JSON.stringify(S.settings)};
  S.tasks.forEach(function(x){snap["t:"+x.id]=stripMod(x)});
  S.projects.forEach(function(x){snap["p:"+x.id]=stripMod(x)});
  S.templates.forEach(function(x){snap["m:"+x.id]=stripMod(x)});
}
function stamp(){
  var now=Date.now(), seen={};
  if(!S.gone) S.gone={};
  function walk(arr,k){ arr.forEach(function(x){ var key=k+x.id; seen[key]=1; if(snap[key]!==stripMod(x)){ x.mod=now; delete S.gone[x.id]; } }); }
  walk(S.tasks,"t:"); walk(S.projects,"p:"); walk(S.templates,"m:");
  Object.keys(snap).forEach(function(key){ if(key!=="settings"&&!seen[key]) S.gone[key.slice(2)]=now; });
  if(snap.settings!==JSON.stringify(S.settings)) S.settingsMod=now;
  snapAll();
}
function loadLocal(){ try{ var j=localStorage.getItem(LS); if(j) S=norm(JSON.parse(j)); }catch(e){} snapAll(); }
function save(){
  stamp();
  S.updated=Date.now();
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
  if(GH.cfg){ clearTimeout(GH.timer); GH.timer=setTimeout(ghSync,2000); }
  renderSync();
}
function flush(){
  if(!dbDoc||saving||!dirty) return;
  saving=true; dirty=false;
  dbDoc.set({json:JSON.stringify(S),updated:S.updated}).then(function(){sync="synced"}).catch(function(){sync="local"}).then(function(){
    saving=false; renderSync(); if(dirty) flush();
  });
}
function renderSync(){
  var el=$("#sync"); if(!el) return;
  if(GH.cfg){
    el.className="sync"+(GH.status==="ok"?" ok":"");
    el.innerHTML="<b></b>"+({ok:"Synced",syncing:"Syncing...",error:"Sync problem",offline:"Offline, saved here"}[GH.status]||"Sync on");
    return;
  }
  el.className="sync"+(sync==="synced"&&!dirty?" ok":"");
  el.innerHTML="<b></b>"+(dbDoc?(sync==="synced"&&!dirty?"Synced":"Saving..."):"This device only");
}

/* ---------- sync through a private GitHub repo (installed app) ----------
   The token lives only in this device's localStorage (key onething.sync), never in S or backups.
   data.json in the repo holds S. Each round: read it, merge item by item (newest change wins,
   deletions remembered), write back if anything is new. The file's sha guards against overwrites. */
var GH={cfg:null,busy:false,again:false,timer:null,status:"",err:"",last:0}, GHKEY="onething.sync", GHFILE="data.json";
function ghLoad(){ try{ GH.cfg=JSON.parse(localStorage.getItem(GHKEY)||"null"); }catch(e){ GH.cfg=null; } }
function ghStore(){ try{ if(GH.cfg) localStorage.setItem(GHKEY,JSON.stringify(GH.cfg)); else localStorage.removeItem(GHKEY); }catch(e){} }
function ghFetch(path,opt){
  opt=opt||{};
  var h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+((opt.token)||GH.cfg.token)};
  if(opt.body) h["Content-Type"]="application/json";
  return fetch("https://api.github.com"+path,{method:opt.method||"GET",cache:"no-store",headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
}
function ghErr(r){
  if(r.status===401) return {msg:"GitHub did not accept the token. Paste a new one in Settings."};
  if(r.status===403) return {msg:"The token cannot write to the repo. Check its Contents permission."};
  if(r.status===404) return {msg:"Could not find the repo "+(GH.cfg?GH.cfg.repo:"")+"."};
  return {msg:"GitHub answered "+r.status+". Try again in a minute."};
}
function b64enc(str){ var b=new TextEncoder().encode(str), s=""; for(var i=0;i<b.length;i+=32768) s+=String.fromCharCode.apply(null,b.subarray(i,i+32768)); return btoa(s); }
function b64dec(str){ var s=atob(str.replace(/\s/g,"")), b=new Uint8Array(s.length); for(var i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return new TextDecoder().decode(b); }
function stable(v){
  if(Array.isArray(v)) return "["+v.map(stable).join(",")+"]";
  if(v&&typeof v==="object") return "{"+Object.keys(v).filter(function(k){return v[k]!==undefined}).sort().map(function(k){return JSON.stringify(k)+":"+stable(v[k])}).join(",")+"}";
  return JSON.stringify(v===undefined?null:v);
}
function sameData(a,b){ var x=Object.assign({},a), y=Object.assign({},b); delete x.updated; delete y.updated; return stable(x)===stable(y); }
function mergeState(a,b){
  var gone=Object.assign({},a.gone);
  Object.keys(b.gone||{}).forEach(function(id){ if(!(gone[id]>=b.gone[id])) gone[id]=b.gone[id]; });
  function mergeArr(x,y){
    var m={};
    x.forEach(function(i){ m[i.id]=i; });
    y.forEach(function(i){ var c=m[i.id]; if(!c||(i.mod||0)>(c.mod||0)) m[i.id]=i; });
    return Object.keys(m).sort().map(function(id){return m[id]}).filter(function(i){
      if(gone[i.id]===undefined) return true;
      if((i.mod||0)>gone[i.id]){ delete gone[i.id]; return true; }   /* edited after it was deleted elsewhere: keep */
      return false;
    });
  }
  var out={tasks:mergeArr(a.tasks,b.tasks),projects:mergeArr(a.projects,b.projects),templates:mergeArr(a.templates,b.templates)};
  out.gone=gone;
  var sa=a.settingsMod||0, sb=b.settingsMod||0;
  out.settings=JSON.parse(JSON.stringify(sb>sa?b.settings:a.settings)); out.settingsMod=Math.max(sa,sb);
  out.updated=Math.max(a.updated||0,b.updated||0);
  return norm(JSON.parse(JSON.stringify(out)));
}
function withoutExamples(s){
  var c=JSON.parse(JSON.stringify(s));
  c.tasks=c.tasks.filter(function(t){return !t.ex}); c.projects=c.projects.filter(function(p){return !p.ex});
  return c;
}
function ghSync(){
  if(!GH.cfg||!GH.cfg.token) return Promise.resolve();
  clearTimeout(GH.timer); GH.timer=null;
  if(GH.busy){ GH.again=true; return GH.busy; }
  if(navigator.onLine===false){ GH.status="offline"; renderSync(); return Promise.resolve(); }
  var wasOk=GH.status!=="error";
  GH.status="syncing"; renderSync();
  var path="/repos/"+GH.cfg.repo+"/contents/"+GHFILE, tries=0;
  function round(){
    tries++;
    return ghFetch(path).then(function(r){
      if(r.status===404) return null;
      if(!r.ok) throw ghErr(r);
      return r.json();
    }).then(function(f){
      var remote=null;
      if(f){
        if(f.encoding!=="base64") throw {msg:"The sync file has grown past 1 MB."};
        remote=norm(JSON.parse(b64dec(f.content)));
      }
      /* First join on this device: its own example tasks are not worth spreading. */
      var local=(remote&&!GH.cfg.joined)?withoutExamples(S):S;
      var merged=remote?mergeState(local,remote):local;
      if(!sameData(merged,S)){
        S=merged; snapAll();
        try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
        render();
      }
      if(!GH.cfg.joined){ GH.cfg.joined=true; ghStore(); }
      if(remote&&sameData(merged,remote)) return;
      var body={message:"Sync "+new Date().toISOString(),content:b64enc(JSON.stringify(merged))};
      if(f) body.sha=f.sha;
      return ghFetch(path,{method:"PUT",body:body}).then(function(r){
        if((r.status===409||r.status===422)&&tries<4) return round();   /* someone else wrote first: merge again */
        if(!r.ok) throw ghErr(r);
      });
    });
  }
  var p=round().then(function(){ GH.status="ok"; GH.err=""; GH.last=Date.now(); },function(e){
    GH.status="error"; GH.err=(e&&e.msg)||"Could not reach GitHub. Your changes are saved here and will sync later.";
    if(wasOk) toast("Sync problem. Details in Settings.");
  }).then(function(){
    GH.busy=false; renderSync(); refreshSyncBox();
    if(GH.again){ GH.again=false; ghSync(); }
  });
  GH.busy=p;
  return p;
}
function ghConnect(token){
  token=String(token||"").trim();
  if(!token){ GH.err="Paste the token first."; refreshSyncBox(); return; }
  GH.err=""; GH.status="syncing"; refreshSyncBox();
  ghFetch("/user",{token:token}).then(function(r){
    if(!r.ok) throw r.status===401?{msg:"GitHub did not accept that token."}:ghErr(r);
    return r.json();
  }).then(function(u){
    var repo=u.login+"/one-thing-data";
    return ghFetch("/repos/"+repo,{token:token}).then(function(r){
      if(r.status===404) throw {msg:"The token cannot see "+repo+". Give it access to that repo."};
      if(!r.ok) throw ghErr(r);
      GH.cfg={token:token,repo:repo,joined:false}; ghStore();
      return ghSync();
    });
  }).catch(function(e){ GH.status="error"; GH.err=(e&&e.msg)||"Could not reach GitHub."; refreshSyncBox(); }).then(function(){
    if(GH.cfg&&GH.status==="ok") toast("Sync is on.");
    renderSync(); refreshSyncBox();
  });
}
function syncBoxHtml(){
  if(window.claude) return "";
  var h='<div class="section" style="margin:4px 2px 0"><span>Sync across devices</span></div><div id="syncbox" class="fld" style="gap:8px">';
  if(!GH.cfg){
    h+='<span>Keeps your phone, iPad, and computer in step through your private GitHub repo <b>one-thing-data</b>.</span>'+
      '<div class="pickrow"><input id="gh-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste GitHub token" aria-label="GitHub token"><button class="btn" data-act="ghconnect"'+(GH.status==="syncing"?" disabled":"")+'>'+(GH.status==="syncing"?"Checking...":"Connect")+'</button></div>';
  }else{
    var when=GH.last?new Date(GH.last).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}):"";
    h+='<span>Syncing with '+esc(GH.cfg.repo)+'. '+(GH.status==="syncing"?"Syncing now...":GH.status==="ok"?"Last synced "+esc(when)+".":GH.status==="offline"?"Offline. Changes are saved here.":"")+'</span>'+
      '<div class="btns"><button class="btn small" data-act="ghsync">Sync now</button><button class="btn small ghost" data-act="ghoff">Turn off on this device</button></div>';
  }
  if(GH.err) h+='<span style="color:var(--bad)">'+esc(GH.err)+'</span>';
  return h+'</div>';
}
function refreshSyncBox(){ var b=$("#syncbox"); if(b) b.outerHTML=syncBoxHtml().replace(/^[\s\S]*?(<div id="syncbox")/,"$1"); }
function hasData(){return S.tasks.length>0||S.projects.length>0}
function initSync(){
  var first=true;
  function fallback(){ if(!first) return; first=false; if(!hasData()) seed(); render(); }
  try{
    if(!window.claude||!window.claude.use){ fallback(); return; }
    window.claude.use("sample").then(function(s){ SAMPLE=s||null; if(SAMPLE) render(); }).catch(function(){});
    Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
      var db=r[0], user=r[1];
      if(!db||!user){ fallback(); return; }
      return user.id().then(function(id){
        if(!id){ fallback(); return; }
        dbDoc=db.doc("data/users/"+id+"/app");
        setTimeout(fallback,6000);
        dbDoc.onSnapshot(function(snap){
          var d=snap.exists?snap.data():null;
          if(d&&d.json){
            try{ var rem=norm(JSON.parse(d.json)); if((rem.updated||0)>(S.updated||0)){ S=rem; snapAll(); try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} render(); } }catch(e){}
          }
          if(first&&!snap.metadata.fromCache){
            first=false;
            if(!snap.exists){ if(!hasData()) seed(); else { dirty=true; flush(); } }
            render();
          }
          sync=snap.metadata.fromCache?"local":"synced"; renderSync();
        },function(){ sync="local"; renderSync(); fallback(); });
      });
    }).catch(fallback);
  }catch(e){ fallback(); }
}
function mkTask(o){
  var n=Date.now();
  return Object.assign({id:uid(),title:"",notes:"",project:null,tags:[],energy:null,due:null,defer:null,est:null,plan:null,remind:null,someday:false,done:false,doneAt:null,inbox:false,created:n,order:n},o);
}
function seed(){
  var p={id:uid(),name:"Example: Pump skid upgrade",sequential:true,ex:true};
  S.projects.push(p);
  var n=Date.now(), k=0;
  function T(o){ o.ex=true; o.order=n+(k++); S.tasks.push(mkTask(o)); }
  T({title:"Tap the circle to finish me. Tap the text to edit.",inbox:true});
  T({title:"Type a task above. End it with 'tomorrow' or 'fri' to schedule it.",plan:todayStr()});
  T({title:"Tap the calendar icon to move a task to another day.",plan:todayStr(),est:5});
  T({title:"Review P&ID and I/O list",project:p.id,tags:["office"],energy:"med",est:30});
  T({title:"Build the pump AOI",project:p.id,tags:["office"],energy:"high",est:90});
  T({title:"Commission in the field",project:p.id,tags:["field"],energy:"med"});
  save();
}

/* ---------- model helpers ---------- */
function proj(id){ for(var i=0;i<S.projects.length;i++) if(S.projects[i].id===id) return S.projects[i]; return null; }
function projByName(n){ var k=String(n).trim().toLowerCase(); for(var i=0;i<S.projects.length;i++) if(S.projects[i].name.toLowerCase()===k) return S.projects[i]; return null; }
function task(id){ for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id===id) return S.tasks[i]; return null; }
function byOrder(a,b){return a.order-b.order}
function available(t){
  if(t.done||t.someday) return false;
  if(t.defer&&t.defer>todayStr()) return false;
  var p=proj(t.project);
  if(p&&p.sequential){
    var f=S.tasks.filter(function(x){return x.project===p.id&&!x.done&&!x.someday}).sort(byOrder)[0];
    return !!f&&f.id===t.id;
  }
  return true;
}
function dueSort(a,b){ var x=a.due||"9999", y=b.due||"9999"; return x<y?-1:x>y?1:a.order-b.order; }
function planSort(a,b){ var x=a.plan||a.due||"9999", y=b.plan||b.due||"9999"; return x<y?-1:x>y?1:a.order-b.order; }
function listInbox(){return S.tasks.filter(function(t){return !t.done&&t.inbox}).sort(byOrder)}
function listToday(){
  var td=todayStr();
  return S.tasks.filter(function(t){
    if(t.done||t.someday||(t.defer&&t.defer>td)) return false;
    return (t.plan&&t.plan<=td)||(t.due&&t.due<=td);
  }).sort(planSort);
}
function tasksForDay(d){
  if(d===todayStr()) return listToday();
  return S.tasks.filter(function(t){ return !t.done&&!t.someday&&(t.plan===d||(!t.plan&&t.due===d)); }).sort(byOrder);
}
function listPullAll(){
  return S.tasks.filter(function(t){return !t.inbox&&!t.plan&&available(t)&&(!filt.energy||t.energy===filt.energy)}).sort(dueSort);
}
function listLater(){return S.tasks.filter(function(t){return !t.done&&t.someday}).sort(byOrder)}

/* ---------- quick capture ---------- */
var DOW={sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
/* Reads a trailing "when" from a task line, in this order:
   1. a relative time: "in 45 mins", "in an hour", "in half an hour", "in 2 hrs"  -> reminder, on that day
   2. a clock time:    "at 3pm", "9:30am", "at 15:30", "at 3"                    -> reminder at that time
   3. a day:           "today", "tomorrow", "fri", "next week", "in 3 days", "in a few days", "in a couple days", "in a week"
   A day phrase after "due", "is due", or "by" sets the deadline instead of the do-date.
   Everything read is cut from the end of the title; out.words keeps it for "Keep as text". */
var NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,couple:2,few:3};
function atTime(day,h,mi){ var d=dt(day); d.setHours(h,mi||0,0,0); return d.getTime(); }
function parseWhen(s){
  var out={rest:s,plan:null,due:null,remind:null,words:null}, m, time=null;
  function take(re){ var mm=out.rest.match(re); if(mm) out.rest=out.rest.slice(0,mm.index); return mm; }
  if((m=take(/\s+in\s+(\d+(?:\.\d+)?|an?|one|two|three|four|five|ten|half\s+an?)\s*(m|mins?|minutes?|h|hrs?|hours?)\.?$/i))){
    var half=/^half/i.test(m[1]), n=half?0.5:(NUMW[m[1].toLowerCase()]||+m[1]), hrs=half||/^h/i.test(m[2]);
    out.remind=Math.round((Date.now()+n*(hrs?60:1)*60000)/60000)*60000;   /* to the whole minute */
    out.plan=ymd(new Date(out.remind));
  }else{
    if((m=take(/\s+(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.|a|p)$/i))){
      var h=+m[1]%12; if(/^p/i.test(m[3])) h+=12; time={h:h,mi:+(m[2]||0)};
    }else if((m=take(/\s+at\s+(\d{1,2})(?::(\d{2}))?$/i))){
      var h2=+m[1]; if(h2>=1&&h2<=6) h2+=12;   /* "at 3" means the afternoon */
      if(h2<24) time={h:h2,mi:+(m[2]||0)};
    }
    var day=null, isDue=false, dm;
    if((dm=take(/\s+(?:today|tonight)$/i))) day=todayStr();
    else if((dm=take(/\s+(?:tomorrow|tmrw|tmr)$/i))) day=addDays(1);
    else if((dm=take(/\s+next week$/i))) day=nextDow(1);
    else if((dm=take(/\s+in\s+(?:a\s+)?(\d+|a|an|one|two|three|four|five|six|seven|couple|few)(?:\s+of)?\s+(days?|weeks?)$/i))){
      var k=NUMW[dm[1].toLowerCase()]||+dm[1]; day=addDays(/^w/i.test(dm[2])?7*k:k);
    }
    else if((dm=take(/\s+(by\s+|due\s+|on\s+)?(sun|sunday|mon|monday|tue|tues|tuesday|wed|weds|wednesday|thu|thur|thurs|thursday|fri|friday|sat|saturday)$/i))){
      day=nextDow(DOW[dm[2].toLowerCase()]); if(dm[1]&&/^(by|due)/i.test(dm[1])) isDue=true;
    }
    if(day&&!isDue&&take(/\s+(?:is\s+)?(?:due|by)$/i)) isDue=true;
    if(day){ if(isDue) out.due=day; else out.plan=day; }
    if(time){
      var when=day||todayStr(), at=atTime(when,time.h,time.mi);
      if(!day&&at<=Date.now()) { when=addDays(1); at=atTime(when,time.h,time.mi); }
      out.remind=at;
      if(!out.plan) out.plan=when;   /* a time means a day to do it, even when a deadline is set too */
    }
  }
  out.rest=out.rest.replace(/\s+$/,"");
  if(out.rest.length<s.length) out.words=s.slice(out.rest.length).trim();
  return out;
}
function parseLine(line){
  var t={title:"",tags:[],est:null,today:false,pname:null,plan:null,due:null};
  var s=" "+line+" ";
  s=s.replace(/\s#([^\s#@!~]+)/g,function(m,n){t.pname=n;return " "});
  s=s.replace(/\s@([^\s#@!~]+)/g,function(m,n){t.tags.push(n.toLowerCase());return " "});
  s=s.replace(/\s~(\d+)m?(?=\s)/g,function(m,n){t.est=+n;return " "});
  s=s.replace(/\s!(?=\s)/g,function(){t.today=true;return " "});
  s=s.replace(/\s+/g," ").trim();
  var w=parseWhen(s); t.title=w.rest.trim(); t.plan=w.plan; t.due=w.due; t.remind=w.remind; t.words=w.words||null;
  if(t.today&&!t.plan) t.plan=todayStr();
  return t;
}
function findProject(name){
  var k=name.toLowerCase().replace(/[^a-z0-9]/g,"");
  for(var i=0;i<S.projects.length;i++){
    var pk=S.projects[i].name.toLowerCase().replace(/[^a-z0-9]/g,"");
    if(pk.indexOf(k)===0) return S.projects[i];
  }
  return null;
}
function addFromText(raw){
  var lines=raw.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean);
  var n=Date.now(), added=0, last=null, lastP=null;
  lines.forEach(function(line,i){
    var p=parseLine(line); if(!p.title) return;
    var pr=null;
    if(p.pname){ pr=findProject(p.pname); if(!pr){ pr={id:uid(),name:p.pname,sequential:false}; S.projects.push(pr); } }
    var t=mkTask({title:p.title,project:pr?pr.id:null,tags:p.tags,est:p.est,plan:p.plan,due:p.due,remind:p.remind||null,order:n+i});
    if(!t.project&&view.indexOf("p:")===0) t.project=view.slice(2);
    placeByView(t);
    S.tasks.push(t); added++; last=t; lastP=p;
  });
  if(!added) return 0;
  save(); render();
  if(added>1){ toast("Added "+added+" tasks."); return added; }
  var msg=last.remind?"Reminder "+remindLabel(last.remind)+".":
    lastP.due&&!lastP.plan?"Added. "+dueLabel(last.due)+". Reminder that morning.":"Added"+(last.plan?" for "+dayWord(last.plan):"")+".";
  if(!lastP.words){ toast(msg); return added; }
  /* A date came from the last word(s). One tap undoes that reading and keeps the words in the title. */
  var tid=last.id, words=lastP.words, bang=lastP.today, from=view;
  toast(msg,function(){
    var x=task(tid); if(!x) return;
    x.title=x.title+" "+words; x.plan=bang?todayStr():null; x.due=null; x.remind=null;
    placeByView(x,from); save(); render(); toast("Kept as text. "+(x.plan?"Set for "+dayWord(x.plan)+".":"No date."));
  },"Keep as text");
  return added;
}
/* Where a task with no date lands depends on the list you added it from. */
function placeByView(t,v){
  v=v||view;
  if(v==="cal"){ if(CAL.add==="later"){ if(!t.plan&&!t.due) t.someday=true; } else if(!t.plan&&CAL.add) t.plan=CAL.add; return; }
  if(!t.plan&&v==="today") t.plan=todayStr();
  if(!t.plan&&v==="plan") t.plan=planDay;
  if(v==="later"&&!t.plan&&!t.due) t.someday=true;   /* a date wins over parking it */
  if(v==="inbox"&&!t.project&&!t.plan&&!t.due) t.inbox=true;
}

/* ---------- left over from earlier days ----------

function isLeftover(t){ var td=todayStr(); return !t.done&&!t.someday&&((t.plan&&t.plan<td)||(!t.plan&&t.due&&t.due<td)); }

/* End of day: after the evening hour (or when the 5 PM alert is tapped), offer to move what is

var WRAP={force:false}, WRAPKEY="onething.wrapkept";

/* ---------- reminders ----------
   A task's own reminder fires at its time; anything due today gets one heads-up at 9:00.
   This runs whenever the app is open (and right when it is reopened). Finished tasks never fire.
   Each device remembers what it already showed (localStorage onething.notified). */
var NOTIKEY="onething.notified", DUE_HOUR=9;
function notiLoad(){ try{ return JSON.parse(localStorage.getItem(NOTIKEY)||"{}"); }catch(e){ return {}; } }
function notiSave(m){ var old=Date.now()-4*864e5; Object.keys(m).forEach(function(k){ if(m[k]<old) delete m[k]; }); try{ localStorage.setItem(NOTIKEY,JSON.stringify(m)); }catch(e){} }
function notifyOS(title,body,tag){
  try{
    if("Notification" in window&&Notification.permission==="granted"&&navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(title,{body:body,tag:tag,icon:"icons/icon-192.png",badge:"icons/icon-192.png"}); });
      return true;
    }
  }catch(e){}
  return false;
}
function checkReminders(){
  var now=Date.now(), sent=notiLoad(), td=todayStr(), fired=[];
  S.tasks.forEach(function(t){
    if(t.done||!t.remind||t.remind>now) return;
    var k="r:"+t.id+":"+t.remind; if(sent[k]) return;
    sent[k]=now;
    if(now-t.remind<6*3600e3) fired.push({t:t,why:"Reminder"});   /* skip ones more than 6 hours stale */
  });
  if(new Date().getHours()>=DUE_HOUR) S.tasks.forEach(function(t){
    if(t.done||t.due!==td) return;
    var k="d:"+t.id+":"+td; if(sent[k]) return;
    sent[k]=now; fired.push({t:t,why:"Due today"});
  });
  if(!fired.length) return;
  notiSave(sent);
  fired.forEach(function(f){
    /* With closed-app alerts on, the server already sends the system notification. */
    if(pushOnHere()){ if(document.visibilityState==="visible") toast((f.why==="Due today"?"Due today: ":"⏰ ")+f.t.title); return; }
    if(!notifyOS(f.why==="Due today"?"Due today":"One Thing",f.t.title,f.t.id)) toast((f.why==="Due today"?"Due today: ":"⏰ ")+f.t.title);
  });
  if(document.visibilityState==="visible"&&fired.length) render();
}
/* Alerts when the app is closed: the push server (server/ in the repo) sends them.
   PUSH_URL is set after the server is deployed; until then none of this shows.
   A device signs up with the GitHub token it already uses for sync. */
var PUSH_URL="", PUSHKEY="onething.push";
function pushUrl(){ try{ return localStorage.getItem("onething.pushurl")||PUSH_URL; }catch(e){ return PUSH_URL; } }
function pushOnHere(){ try{ return !!localStorage.getItem(PUSHKEY); }catch(e){ return false; } }
function pushCapable(){ return !!(pushUrl()&&"serviceWorker" in navigator&&"PushManager" in window&&!window.claude); }
function u8key(b64){ var s=atob(b64.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((b64.length+3)%4)), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
var PUSHST={busy:false,err:""};
function pushOn(){
  if(!pushCapable()||!GH.cfg||PUSHST.busy) return Promise.resolve();
  PUSHST={busy:true,err:""}; refreshNotiBox();
  var base=pushUrl().replace(/\/$/,"");
  return navigator.serviceWorker.ready.then(function(reg){
    return fetch(base+"/vapid").then(function(r){return r.json()}).then(function(v){
      return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8key(v.publicKey)});
    });
  }).then(function(sub){
    var tz="UTC"; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"; }catch(e){}
    return fetch(base+"/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({subscription:sub.toJSON?sub.toJSON():sub,tz:tz,token:GH.cfg.token})}).then(function(r){
      if(!r.ok) return r.json().catch(function(){return {}}).then(function(j){ throw {msg:j.error||"The alert server said no ("+r.status+")."}; });
      try{ localStorage.setItem(PUSHKEY,JSON.stringify({endpoint:sub.endpoint,at:Date.now()})); }catch(e){}
      toast("Alerts are on, even with the app closed.");
    });
  }).catch(function(e){ PUSHST.err=(e&&e.msg)||"Could not turn on alerts. Try again in a minute."; })
  .then(function(){ PUSHST.busy=false; refreshNotiBox(); });
}
function pushOff(){
  if(!("serviceWorker" in navigator)) return;

    if(!sub) return;
    return fetch(base+"/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint,token:GH.cfg&&GH.cfg.token})})
      .catch(function(){}).then(function(){ return sub.unsubscribe(); });
  }).catch(function(){}).then(function(){

/* ---------- calendar ---------- */
function doneOn(d){ return S.tasks.filter(function(t){ return t.done&&t.doneAt&&ymd(new Date(t.doneAt))===d; }).sort(function(a,b){return a.doneAt-b.doneAt}); }
function shortDate(d){ return dt(d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

function calBar(){
  var away=CAL.mode==="month"?CAL.month!==0:CAL.week!==0;
  return '<div class="calbar"><div class="seg" role="group" aria-label="Calendar view">'+
    '<button class="'+(CAL.mode==="week"?"on":"")+'" data-act="calmode" data-v="week">Week</button>'+
    '<button class="'+(CAL.mode==="month"?"on":"")+'" data-act="calmode" data-v="month">Month</button></div>'+
    '<div class="pager">'+(away?'<button class="btn small ghost" data-act="calnow">Today</button>':'')+
    '<button class="icon-btn" data-act="calstep" data-v="-1" aria-label="Earlier">&lsaquo;</button>'+
    '<button class="icon-btn" data-act="calstep" data-v="1" aria-label="Later">&rsaquo;</button></div></div>';
}
function dayCol(d){
  var td=todayStr(), past=d<td, dd=dt(d);
  var name=d===td?"Today":d===addDays(1)?"Tomorrow":d===addDays(-1)?"Yesterday":dd.toLocaleDateString(undefined,{weekday:"long"});
  var h, cnt, list=function(a,o){ return a.length?'<ul class="list">'+a.map(function(t){return taskRow(t,o)}).join("")+'</ul>':''; };
  if(past){
    /* A past day: what you finished, and anything still sitting there (drag it forward). */
    var dn=doneOn(d), lo=leftOn(d);
    cnt=(dn.length?'<em class="cnt">'+dn.length+' done</em>':'')+(lo.length?'<em class="cnt left">'+lo.length+' left over</em>':'');
    h='<div class="dcol past"><div class="dhead"><div class="dname"><span>'+esc(name)+'</span><small>'+esc(shortDate(d))+'</small></div><div class="cnts">'+cnt+'</div></div>'+
      list(lo,{hidePlan:true,drag:true})+list(dn,{hidePlan:true});
    return h+'</div>';
  }
  var arr=tasksForDay(d), early=d===td?arr.filter(isLeftover):[], rest=early.length?arr.filter(function(t){return !isLeftover(t)}):arr;
  var n=arr.length;
  cnt=n?'<em class="cnt">'+n+' '+(n===1?"task":"tasks")+'</em>':'';
  h='<div class="dcol'+(d===td?" today":"")+'" data-drop="'+d+'"><div class="dhead"><div class="dname"><span>'+esc(name)+'</span><small>'+esc(shortDate(d))+'</small></div>'+cnt+'</div>';
  if(early.length) h+=earlierHead(early.length,true)+list(early,{drag:true});
  if(rest.length) h+=(early.length?'<div class="dsub plain incol">Today</div>':'')+list(rest,{hidePlan:true,drag:true});
  h+=CAL.add===d?captureHtml("Add to "+dayWord(d)):'<button class="dadd" data-act="dayadd" data-v="'+d+'">+ Add</button>';
  return h+'</div>';
}
function weekHtml(){
  var h='<div class="week">';
  for(var i=0;i<7;i++) h+=dayCol(addDays(7*CAL.week+i));
  return h+'</div>';
}
function monthHtml(){
  var b=monthBase(), y=b.getFullYear(), mo=b.getMonth(), lead=(b.getDay()+6)%7, n=new Date(y,mo+1,0).getDate();
  var td=todayStr(), sel=CAL.sel||td;
  var g='<div class="month">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(w){return '<div class="dow">'+w+'</div>'}).join("");
  for(var i=0;i<lead;i++) g+='<div class="mday blank"></div>';
  for(var dn=1;dn<=n;dn++){
    var d=y+"-"+pad(mo+1)+"-"+pad(dn), past=d<td;
    var c=past?doneOn(d).length:tasksForDay(d).length, left=past?leftOn(d).length:0;
    var due=!past&&S.tasks.some(function(t){return !t.done&&t.due===d});
    var marks='';
    if(past){ if(c||left) marks='<span class="mdots" aria-hidden="true">'+(c?'<span class="ok">&#10003;</span>':'')+(left?'<i class="left"></i>':'')+'</span>'; }
    else if(c||due){
      var dots=(due?'<i class="due"></i>':'');
      for(var j=0;j<Math.min(c-(due?1:0),due?2:3);j++) dots+='<i></i>';
      marks='<span class="mdots" aria-hidden="true">'+dots+(c>3?'<b>+</b>':'')+'</span>';
    }
    g+='<button class="mday'+(past?" past":"")+(d===td?" today":"")+(d===sel?" sel":"")+'" data-act="calpick" data-v="'+d+'" data-count="'+c+'"'+(past?'':' data-drop="'+d+'"')+
      ' aria-label="'+esc(dt(d).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))+(c?", "+c+(past?" done":c===1?" task":" tasks"):"")+(left?", "+left+" left over":"")+(due?", something due":"")+'">'+
      '<span>'+dn+'</span>'+marks+'</button>';
  }
  g+='<div class="mlegend" aria-hidden="true"><span><i></i>task</span><span><i class="due"></i>due</span><span><b class="ok">&#10003;</b>done</span><span><i class="left"></i>left over</span></div>';
  return '<div class="monthwrap">'+g+'</div><div>'+dayCol(sel)+'</div></div>';
}
function trayHtml(){
  function grp(key,label,arr,drop,extra){
    var open=CAL.tray[key];
    var h='<div data-drop="'+drop+'"><button class="trayh" data-act="tray" data-v="'+key+'" aria-expanded="'+open+'">'+label+'<span>'+arr.length+(open?' &#9662;':' &#9656;')+'</span></button>';
    if(open){
      if(arr.length) h+='<ul class="list">'+arr.map(function(t){return taskRow(t,{drag:true})}).join("")+'</ul>';
      h+=extra||"";
    }
    return h+'</div>';
  }
  var park=CAL.add==="later"?captureHtml("Park an idea"):'<button class="dadd" data-act="dayadd" data-v="later">+ Park an idea</button>';
  return '<div class="section"><span>Not scheduled</span></div><div class="card tray">'+
    grp("any","Anytime",listPullAll().filter(function(t){return !t.due}),"anytime")+grp("later","Later",listLater(),"later",park)+'</div>';
}
/* Moving a task by dragging it onto a day, or onto Anytime / Later. */
function moveTask(id,to){
  var t=task(id); if(!t) return;
  var was={plan:t.plan,someday:t.someday,inbox:t.inbox};
  if(to==="later"){ t.someday=true; t.plan=null; }
  else if(to==="anytime"){ t.someday=false; t.plan=null; }
  else { t.plan=to; t.someday=false; }
  t.inbox=false;
  if(t.plan===was.plan&&t.someday===was.someday&&t.inbox===was.inbox) return;
  save(); render();
  toast(to==="later"?"Moved to Later.":to==="anytime"?"Moved to Anytime.":"Moved to "+dayWord(to)+".",function(){
    var x=task(id); if(!x) return; x.plan=was.plan; x.someday=was.someday; x.inbox=was.inbox; save(); render();
  });
}

    (ASK.busy?'<span class="btns"><button class="btn ghost" data-act="askstop">Stop</button><button class="btn primary" disabled>Sorting...</button></span>'
      :'<span class="btns">'+(ai?'<button class="btn" data-act="askgo"><span style="display:inline-flex;gap:6px;align-items:center">'+IC.spark.replace('width="20" height="20"','width="16" height="16"')+'Sort it out</span></button>':'')+

function inboxSave(){
  var e=$("#ask-in"); if(!e) return;
  var txt=e.value; if(!txt.trim()) return;
  e.value=""; ASK.text=""; ASK.err="";
  addFromText(txt);
  var e2=$("#ask-in"); if(e2){ e2.value=""; e2.focus(); }
}
function captureHtml(ph,hint){
  return '<div class="capwrap"><div class="capture"><textarea id="cap" rows="1" placeholder="'+esc(ph)+'" aria-label="Add task"></textarea><button class="go" data-act="add" aria-label="Add">'+IC.plus+'</button></div>'+
    '<div class="hint">'+(hint||'Try <code>tomorrow</code> <code>fri</code> <code>in 45 mins</code> <code>at 3pm</code> <code>#project</code>')+'</div></div>';

function head(title,sub,cls){
  return '<div class="head"><div><h1>'+esc(title)+'</h1>'+(sub?'<div class="sub '+(cls||"")+'">'+sub+'</div>':"")+'</div><div class="hbtns">'+
    (aiReady()&&view!=="inbox"?'<button class="icon-btn" data-act="ask" aria-label="Sort it out with Claude" title="Sort it out with Claude">'+IC.spark+'</button>':"")+
    '<button class="icon-btn" data-act="settings" aria-label="Settings">'+IC.gear+'</button>'+
    '<button class="btn primary" data-act="focus">Focus</button></div></div>';
}
function renderRail(){
  var counts={today:listToday().length,cal:null,inbox:listInbox().length,projects:null};
  $("#rail").innerHTML='<div class="brand">One<i>Thing</i></div>'+VIEWS.map(function(v){
    var on=view===v[0]||(v[0]==="projects"&&view.indexOf("p:")===0)||(v[0]==="today"&&view==="done");
    var c=counts[v[0]];
    return '<button class="nav'+(on?" on":"")+'" data-view="'+v[0]+'"><span>'+v[1]+'</span>'+(c?'<span class="badge">'+c+'</span>':"")+'</button>';
  }).join("")+
  '<div class="foot"><div>'+doneToday()+' done today</div><div id="sync" class="sync"></div><button class="linkbtn" style="text-align:left;padding:4px 0;min-height:0" data-act="settings">Settings</button></div>';
  renderSync();
}
function render(){
  /* Old screen names still work: Plan and Later live in Calendar now, Sort lives in Inbox. */
  if(view==="plan") view="cal";
  if(view==="later"){ view="cal"; CAL.tray.later=true; }
  if(view==="sort") view="inbox";
  renderRail();
  var m=$("#main"), h="";
  m.className="main"+(view==="cal"?" wide":"");
  if(view==="today"){
    var td=listToday(), lim=S.settings.todayLimit, over=td.length>lim;
    var tmr=tasksForDay(addDays(1)).length, nIn=listInbox().length, nDone=doneToday();
    var wrapB=wrapDue()?'<div class="banner wrap"><span><b>End of day</b> &middot; '+td.length+' still open</span><span class="btns"><button class="btn small ghost" data-act="wrapkeep">Keep</button><button class="btn small primary" data-act="wraptomorrow">Move to tomorrow</button></span></div>':'';
    var banner=wrapB+(nIn?'<div class="banner"><span>'+nIn+' in Inbox to sort</span><button class="btn small ghost" data-view="inbox">Open Inbox</button></div>'
      :(!wrapB&&new Date().getHours()>=15&&tmr===0)?'<div class="banner"><span>Tomorrow is empty.</span><button class="btn small ghost" data-act="plantomorrow">Plan it</button></div>':"");
    h=head("Today",td.length+" planned"+(over?" &middot; over your limit of "+lim:""),over?"over":"")+
      banner+captureHtml("Add to today")+
      earlierHtml()+listHtml(td.filter(function(t){return !isLeftover(t)}),{hidePlan:true},earlierList().length?"Nothing else planned for today.":"Nothing planned yet.")+pullHtml(todayStr())+
      '<div class="links"><button class="linkbtn" data-act="plantomorrow">See the week &rarr;</button>'+(nDone?'<button class="linkbtn" data-view="done">'+nDone+' done today &rarr;</button>':'')+'</div>';
  }else if(view==="cal"){
    h=head("Calendar",calSub())+calBar()+(CAL.mode==="month"?monthHtml():weekHtml())+trayHtml();
  }else if(view==="inbox"){
    var a=listInbox();
    h=head("Inbox",ASK.items.length?"Check what Claude found, then add it.":a.length?a.length+" to sort":"")+inboxBoxHtml()+
      (ASK.items.length?"":listHtml(a,{triage:true},"Inbox is clear."));
  }else if(view==="projects"){
    var tp=BUILTIN.map(function(x,i){return '<button class="btn small" data-act="tpl" data-tpl="b'+i+'">'+esc(x.name)+'</button>'}).join("")+
      S.templates.map(function(x){return '<span class="btn small tpl"><button data-act="tpl" data-tpl="s'+x.id+'">'+esc(x.name)+'</button><button class="x" data-act="deltpl" data-tpl="'+x.id+'" aria-label="Delete template">&times;</button></span>'}).join("");
    h=head("Projects",S.projects.length?S.projects.length+" active":"")+
      (newOpen?'<div class="newp"><textarea id="newp" placeholder="Name on the first line, then one step per line" aria-label="New project"></textarea>'+
        '<div class="row"><label class="tog"><input id="newp-seq" type="checkbox" checked>One step at a time</label><span class="btns"><button class="btn ghost" data-act="togglenewp">Cancel</button><button class="btn primary" data-act="newproject">Create</button></span></div>'+
        '<div class="section" style="margin:6px 2px 0"><span>Or start from a template</span></div><div class="tplrow">'+tp+'</div></div>'
       :'<button class="btn" data-act="togglenewp" style="margin-bottom:18px">+ New project</button>')+
      (S.projects.length?'<div class="card">'+S.projects.map(projCard).join("")+'</div>':'<div class="card"><div class="empty">No projects yet.</div></div>');
  }else if(view.indexOf("p:")===0){
    var p=proj(view.slice(2));
    if(!p){ view="projects"; return render(); }
    var all=S.tasks.filter(function(t){return t.project===p.id}).sort(byOrder);
    var open=all.filter(function(t){return !t.done}), dn=all.filter(function(t){return t.done});
    var firstId=null; if(p.sequential){ var f1=open.filter(function(t){return !t.someday})[0]; firstId=f1&&f1.id; }
    h='<button class="linkbtn" data-act="back" style="padding-left:0">&larr; Projects</button>'+
      head(p.name,(all.length-dn.length)+" left"+(p.sequential?" &middot; one at a time":""))+
      '<div style="display:flex;gap:8px;margin:-8px 0 20px"><button class="btn small" data-act="startproj" data-id="'+p.id+'">Start today</button><button class="btn small ghost" data-act="editproject">Edit project</button></div>'+
      captureHtml("Add steps","One step per line. Paste a whole list if you have one.")+
      (open.length?'<ul class="list card">'+open.map(function(t){return taskRow(t,{reorder:true,hideProj:true,nextUp:t.id===firstId})}).join("")+'</ul>':'<div class="card"><div class="empty">No open steps.</div></div>')+
      (dn.length?'<div class="section"><span>Finished ('+dn.length+')</span></div><ul class="list card">'+dn.map(function(t){return taskRow(t,{hideProj:true})}).join("")+'</ul>':"");
  }else if(view==="done"){
    var d2=listDone();
    h='<button class="linkbtn" data-view="today" style="padding-left:0">&larr; Today</button>'+head("Done",doneToday()+" today")+listHtml(d2,{},"Nothing finished yet.");
  }
  /* A redraw (for example from sync) must not eat what you are typing. */
  var ae=document.activeElement, keepId=ae&&(ae.id==="cap"||ae.id==="ask-in")?ae.id:null;
  var keep=keepId?ae.value:null, selS=keepId?ae.selectionStart:0, selE=keepId?ae.selectionEnd:0;
  m.innerHTML=h;
  if(keepId&&$("#"+keepId)){ var ne=$("#"+keepId); ne.value=keep; ne.focus(); try{ ne.setSelectionRange(selS,selE); }catch(e){} }
  if($("#cap")) setHint(document.activeElement===$("#cap"));
}
function projCard(p){
  var all=S.tasks.filter(function(t){return t.project===p.id}), dn=all.filter(function(t){return t.done}).length;
  var open=all.filter(function(t){return !t.done&&!t.someday}).sort(byOrder);
  var nx=open.filter(available)[0];
  var pct=all.length?Math.round(dn/all.length*100):0;
  return '<div class="pcard" data-proj="'+p.id+'"><div class="prow"><div class="pname">'+esc(p.name)+'</div>'+(nx?'<button class="btn small ghost" data-act="startproj" data-id="'+p.id+'">Start today</button>':"")+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="pmeta">'+dn+' of '+all.length+' done'+(nx?" &middot; Next: "+esc(nx.title):"")+'</div></div>';
}

function setDay(id,v){
  var t=task(id); if(!t) return;
  var d=null;
  if(v==="today") d=todayStr(); else if(v==="tomorrow") d=addDays(1); else if(/^\d{4}-\d{2}-\d{2}$/.test(v)) d=v;
  if(v==="later"){ t.someday=true; t.plan=null; t.inbox=false; }
  else if(v==="anytime"){ t.someday=false; t.plan=null; t.inbox=false; }
  else if(d){ t.plan=d; t.someday=false; t.inbox=false; }
  save(); closeSheet(); render();
  toast(v==="later"?"Moved to Later.":v==="anytime"?"Date cleared.":"Set for "+dayWord(d)+".");
}
function openTask(id){
  var t=task(id); if(!t) return;
  var opts='<option value="">No project</option>'+S.projects.map(function(p){return '<option value="'+p.id+'"'+(t.project===p.id?" selected":"")+'>'+esc(p.name)+'</option>'}).join("");

    '<div class="row2"><label class="fld">Contexts, comma separated<input id="f-tags" value="'+esc((t.tags||[]).join(", "))+'"></label><label class="fld">Minutes<input id="f-est" type="number" min="1" inputmode="numeric" value="'+(t.est||"")+'"></label></div>'+
    '<div class="row2"><label class="fld">Remind me<input id="f-remind" type="datetime-local" value="'+(t.remind?localInput(t.remind):"")+'"></label>'+
    '<label class="fld">Hide until<input id="f-defer" type="date" value="'+(t.defer||"")+'"></label></div>'+

    '<button class="btn" data-act="breakdown" data-id="'+t.id+'">Too big? Break it into steps</button>'+
    '<div class="acts"><button class="btn danger ghost" data-act="deltask" data-id="'+t.id+'">Delete</button><span class="btns"><button class="btn ghost" data-act="closesheet">Cancel</button><button class="btn primary" data-act="savetask" data-id="'+t.id+'">Save</button></span></div>');
  setTimeout(function(){var e=$("#f-title"); if(e&&window.innerWidth>760) e.focus();},30);
}
function saveTask(id){
  var t=task(id); if(!t) return;
  var title=$("#f-title").value.trim(); if(!title) return;
  t.title=title; t.notes=$("#f-notes").value.trim();
  t.project=$("#f-proj").value||null; t.energy=$("#f-energy").value||null;
  t.plan=$("#f-plan").value||null; t.due=$("#f-due").value||null; t.defer=$("#f-defer").value||null;
  var rv=$("#f-remind").value, rms=rv?new Date(rv).getTime():null;
  t.remind=rms&&!isNaN(rms)?rms:null;
  if(t.remind&&!t.plan) t.plan=ymd(new Date(t.remind));
  t.tags=$("#f-tags").value.split(",").map(function(x){return x.trim().toLowerCase().replace(/^@/,"")}).filter(Boolean);
  var e=parseInt($("#f-est").value,10); t.est=e>0?e:null;
  t.someday=$("#f-later").checked;
  if(t.project||t.plan||t.someday||t.due) t.inbox=false;
  save(); closeSheet(); render();
}
function openBreak(id){
  var t=task(id); if(!t) return;
  openSheet('<h2>Break it into steps</h2><div class="sub" style="margin-top:-10px">'+esc(t.title)+'</div>'+
    '<label class="fld">One step per line. Make the first one tiny.<textarea id="b-steps" placeholder="Open the file&#10;List what is missing"></textarea></label>'+
    '<div class="acts"><button class="btn ghost" data-act="closesheet">Cancel</button><button class="btn primary" data-act="dobreak" data-id="'+id+'">Create steps</button></div>');
  setTimeout(function(){var e=$("#b-steps"); if(e) e.focus();},30);
}
function doBreak(id){
  var t=task(id); if(!t) return;
  var steps=cleanLines($("#b-steps").value); if(!steps.length) return;
  /* Already in a project: the steps take the task's place there. Otherwise they become a new project. */
  var p=proj(t.project), inPlace=!!p, start, gap;
  if(inPlace){
    var after=S.tasks.filter(function(x){return x.project===p.id&&x.id!==id&&x.order>t.order}).map(function(x){return x.order});
    var next=after.length?Math.min.apply(null,after):t.order+steps.length;
    start=t.order; gap=(next-t.order)/steps.length;
  }else{

/* ---------- Claude ----------
   Inside claude.ai: the "sample" capability. As an installed app: the Anthropic API with your own key,
   kept only on this device (localStorage onething.ai, never in S or backups). One call per tap of
   Sort it out or I am stuck; nothing runs in the background. The page has no build step, so it calls
   the API with fetch instead of the SDK. */
var AI={key:null,status:"",err:""}, AIKEY="onething.ai", AIMODEL="claude-opus-5-5", AIVER="2026-10-21";
function aiLoad(){ try{ var c=JSON.parse(localStorage.getItem(AIKEY)||"null"); AI.key=(c&&c.key)||null; }catch(e){ AI.key=null; } }
function aiStore(){ try{ if(AI.key) localStorage.setItem(AIKEY,JSON.stringify({key:AI.key})); else localStorage.removeItem(AIKEY); }catch(e){} }
function aiReady(){ return !!(SAMPLE||AI.key); }
function aiHeaders(key){ return {"x-api-key":key||AI.key,"anthropic-version":AIVER,"anthropic-dangerous-direct-browser-access":"true"}; }
function aiHttpErr(status,j){
  var msg=(j&&j.error&&j.error.message)||"";
  if(status===401||status===403) return {code:"bad_key"};
  if(/credit balance/i.test(msg)) return {code:"no_credit"};
  if(status===429) return {code:"rate_limited"};
  if(status>=500) return {code:"overloaded"};
  return {code:"api",msg:msg};
}
function aiJson(prompt,schema,opt){
  opt=opt||{};
  if(SAMPLE) return SAMPLE.json(prompt,{cache:false,signal:opt.signal,modelTier:opt.quick?"quick":undefined});
  if(!AI.key) return Promise.reject({code:"no_key"});
  function call(withFallback){
    var body={model:AIMODEL,max_tokens:16000,output_config:{effort:"medium",format:{type:"json_schema",schema:schema}},
      messages:[{role:"user",content:prompt}]};
    var h=aiHeaders(); h["content-type"]="application/json";
    /* If Claude declines, Anthropic re-runs the request on a fallback model inside the same call. */
    if(withFallback){ body.fallbacks="default"; h["anthropic-beta"]="server-side-fallback-2026-07-01"; }
    return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:h,body:JSON.stringify(body),signal:opt.signal}).then(function(r){
      return r.json().catch(function(){return null}).then(function(j){
        if(r.ok) return j;
        if(withFallback&&r.status===400&&/fallback|beta/i.test((j&&j.error&&j.error.message)||"")) return call(false);
        throw aiHttpErr(r.status,j);
      });
    });
  }
  return call(true).then(function(j){
    if(j.stop_reason==="refusal") throw {code:"refusal"};
    if(j.stop_reason==="max_tokens") throw {code:"too_long"};
    var txt=(j.content||[]).filter(function(b){return b.type==="text"}).map(function(b){return b.text}).join("");
    try{ return JSON.parse(txt); }catch(e){ throw {code:"invalid_json"}; }
  },function(e){
    if(e&&e.name==="AbortError") throw {code:"cancelled"};
    if(e&&e.code) throw e;
    throw {code:"network"};
  });
}
function aiCheckKey(key){
  key=String(key||"").trim();
  if(!key){ AI.err="Paste the key first."; refreshAiBox(); return; }
  AI.status="checking"; AI.err=""; refreshAiBox();
  /* Listing models is free, so this checks the key without spending credit. */
  fetch("https://api.anthropic.com/v1/models?limit=1",{headers:aiHeaders(key)}).then(function(r){
    if(r.ok){ AI.key=key; aiStore(); AI.status=""; toast("Claude is on. Sort it out is ready."); render(); return; }
    return r.json().catch(function(){return null}).then(function(j){ throw aiHttpErr(r.status,j); });
  }).catch(function(e){ AI.status=""; AI.err=errCopy(e&&e.code?e:{code:"network"}); }).then(function(){ refreshAiBox(); });
}

function errCopy(e){
  var c=e&&e.code;
  if(c==="rate_limited") return "Too many requests right now. Try again in a minute.";
  if(c==="not_granted"||c==="sampling_disabled") return "Claude is not allowed in this view. You can still type tasks yourself.";
  if(c==="invalid_json") return "I could not read the answer. Try again, or use less text.";
  if(c==="no_key") return "Add your Anthropic API key in Settings to use this.";
  if(c==="bad_key") return "Anthropic did not accept the API key. Check it in Settings.";
  if(c==="no_credit") return "Your Anthropic account is out of credit. Add some at console.anthropic.com.";
  if(c==="overloaded") return "Claude is busy right now. Try again in a minute.";
  if(c==="refusal") return "Claude would not sort that one. Try wording it differently.";
  if(c==="too_long") return "That was a lot at once. Try a shorter piece.";
  if(c==="network") return "Could not reach Claude. Check your connection.";
