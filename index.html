document.addEventListener("click",function(ev){
  var a=ev.target.closest("[data-act]");
  if(!a){
    var n=ev.target.closest("[data-view]");
    if(n){ view=n.getAttribute("data-view"); if(view==="plan"&&planDay<todayStr()) planDay=addDays(1); if($("#veil").classList.contains("show")) closeSheet(); render(); $("#main").scrollTop=0; return; }
    var pc=ev.target.closest("[data-proj]");
    if(pc){ view="p:"+pc.getAttribute("data-proj"); render(); $("#main").scrollTop=0; return; }
    var fe=ev.target.closest("[data-energy]");
    if(fe){ filt.energy=fe.getAttribute("data-energy")||null; render(); return; }
    var dy=ev.target.closest("[data-day]");
    if(dy){ planDay=dy.getAttribute("data-day"); render(); return; }
    if(ev.target===$("#veil")) closeSheet();
    return;
  }
  var act=a.getAttribute("data-act");
  var li=a.closest("li[data-id]"), id=li?li.getAttribute("data-id"):a.getAttribute("data-id");
  if(!id&&$("#veil").classList.contains("show")) id=$("#sheet").getAttribute("data-id");
  var t=id?task(id):null;
  switch(act){
    case "toggle": toggle(id); break;
    case "open": openTask(id); break;
    case "when": openWhen(id); break;
    case "more": openMore(); break;
    case "setday": setDay(id,a.getAttribute("data-v")); break;
    case "setpick": var pv=$("#pickd").value; if(pv) setDay(id,pv); break;
    case "pull": if(t){ t.plan=a.getAttribute("data-day"); t.inbox=false; save(); render(); toast("Added for "+dayWord(t.plan)+"."); } break;
    case "togglepull": pullOpen=!pullOpen; render(); break;
    case "togglenewp": newOpen=!newOpen; render(); if(newOpen&&$("#newp")) $("#newp").focus(); break;
    case "plantomorrow": view="cal"; CAL.mode="week"; CAL.week=0; render(); $("#main").scrollTop=0; break;
    case "calmode": CAL.mode=a.getAttribute("data-v"); CAL.add=null; render(); break;
    case "calstep": var stp=+a.getAttribute("data-v"); if(CAL.mode==="month") CAL.month+=stp; else CAL.week+=stp; CAL.add=null; render(); break;
    case "calnow": CAL.week=0; CAL.month=0; CAL.sel=null; CAL.add=null; render(); break;
    case "calpick": CAL.sel=a.getAttribute("data-v"); CAL.add=null; render(); break;
    case "dayadd": CAL.add=a.getAttribute("data-v"); if(CAL.add==="later") CAL.tray.later=true; render(); var dc=$("#cap"); if(dc) dc.focus(); break;
    case "tray": var tk=a.getAttribute("data-v"); CAL.tray[tk]=!CAL.tray[tk]; render(); break;
    case "inboxsave": inboxSave(); break;
    case "doalltoday": doAllToday(); break;
    case "wraptomorrow": wrapToTomorrow(); break;
    case "wrapkeep": try{ localStorage.setItem(WRAPKEY,todayStr()); }catch(e){} WRAP.force=false; render(); break;
    case "notion":
      try{ Notification.requestPermission().then(function(p){
        refreshNotiBox();
        if(p!=="granted") return;
        if(pushCapable()&&GH.cfg) pushOn();   /* one tap: allow, and closed-app alerts come with it */
        else { notifyOS("One Thing","Notifications are on.","hello"); toast("Notifications are on."); }
      }); }catch(e){ refreshNotiBox(); }
      break;
    case "pushon": pushOn(); break;
    case "pushoff": pushOff(); break;
    case "add": var c=$("#cap"); if(c&&addFromText(c.value)){ var c1=$("#cap"); if(c1){ c1.value=""; c1.style.height=""; c1.focus(); } } break;
    case "up": move(id,-1); break;
    case "down": move(id,1); break;
    case "focus": openFocus(); break;
    case "settings": openSettings(); break;
    case "closesheet": closeSheet(); break;
    case "savetask": saveTask(id); break;
    case "breakdown": if($("#f-title")&&$("#f-title").value.trim()) saveTask(id); openBreak(id); break;
    case "dobreak": doBreak(id); break;
    case "deltask":
      var gone1=task(id); if(!gone1) break;
      S.tasks=S.tasks.filter(function(x){return x.id!==id}); save(); closeSheet(); render();
      toast("Task deleted.",function(){ if(!task(gone1.id)){ S.tasks.push(gone1); save(); render(); toast("Task is back."); } });
      break;
    case "newproject":
      var lines=cleanLines($("#newp").value);
      if(lines.length){ var np=createProject(lines[0],lines.slice(1),$("#newp-seq").checked); newOpen=false; save(); view="p:"+np.id; render(); toast("Project created"+(lines.length>1?" with "+(lines.length-1)+" steps":"")+"."); }
      break;
    case "tpl":
      var key=a.getAttribute("data-tpl"), tp=null;
      if(key.charAt(0)==="b") tp=BUILTIN[+key.slice(1)]; else tp=S.templates.filter(function(x){return x.id===key.slice(1)})[0];
      if(tp){ var np2=createProject(tp.name,tp.steps,true); newOpen=false; save(); view="p:"+np2.id; render(); toast("Created from template."); }
      break;
    case "deltpl": S.templates=S.templates.filter(function(x){return x.id!==a.getAttribute("data-tpl")}); save(); render(); break;
    case "savetpl":
      var sp=proj(id); if(sp){ var steps=S.tasks.filter(function(x){return x.project===sp.id&&!x.done}).sort(byOrder).map(function(x){return x.title}); S.templates.push({id:uid(),name:sp.name,steps:steps}); save(); closeSheet(); toast("Saved as a template."); }
      break;
    case "startproj": startProject(id); break;
    case "back": view="projects"; render(); break;
    case "editproject": openProject(view.slice(2)); break;
    case "saveproject": var p=proj(id); if(p&&$("#p-name").value.trim()){ p.name=$("#p-name").value.trim(); p.sequential=$("#p-seq").checked; save(); closeSheet(); render(); } break;
    case "delproject":
      var gp=proj(id); if(!gp) break;
      var moved=S.tasks.filter(function(x){return x.project===id}).map(function(x){return {id:x.id,inbox:x.inbox}});
      S.tasks.forEach(function(x){ if(x.project===id){ x.project=null; if(!x.done) x.inbox=true; } });
      S.projects=S.projects.filter(function(x){return x.id!==id}); save(); closeSheet(); view="projects"; render();
      toast("Project deleted. Open tasks moved to Inbox.",function(){
        if(proj(gp.id)) return;
        S.projects.push(gp);
        moved.forEach(function(m){ var x=task(m.id); if(x&&!x.project){ x.project=gp.id; x.inbox=m.inbox; } });
        save(); view="p:"+gp.id; render(); toast("Project is back.");
      });
      break;
    case "savesettings": var v=parseInt($("#s-lim").value,10); if(v>0) S.settings.todayLimit=Math.min(v,20); save(); closeSheet(); render(); break;
    case "clearex": S.tasks=S.tasks.filter(function(x){return !x.ex}); S.projects=S.projects.filter(function(x){return !x.ex}); save(); closeSheet(); view="today"; render(); break;
    case "copybackup":
      try{ navigator.clipboard.writeText(JSON.stringify(S)).then(function(){toast("Backup copied.")},function(){toast("Copy was blocked. Copy it from the box.");$("#s-restore").value=JSON.stringify(S)}); }
      catch(e){ $("#s-restore").value=JSON.stringify(S); toast("Backup is in the box. Copy it from there."); }
      break;
    case "restore":
      try{ var r=norm(JSON.parse($("#s-restore").value)); if(!Array.isArray(r.tasks)) throw 0; S=r; save(); closeSheet(); view="today"; render(); toast("Restored "+S.tasks.length+" tasks."); }
      catch(e){ toast("That is not a valid backup."); }
      break;
    case "ghconnect": ghConnect($("#gh-token").value); break;
    case "ghsync": ghSync(); refreshSyncBox(); break;
    case "ghoff": GH.cfg=null; GH.status=""; GH.err=""; ghStore(); renderSync(); refreshSyncBox(); toast("Sync is off on this device. Your tasks stay here."); break;
    case "ask": view="inbox"; render(); $("#main").scrollTop=0; var ai2=$("#ask-in"); if(ai2) ai2.focus(); break;
    case "askgo": askGo(); break;
    case "askstop": abortAsk(); ASK.busy=false; renderAsk(); break;
    case "askback": ASK.items=[]; ASK.err=""; renderAsk(); break;
    case "askclear": ASK.text=""; ASK.err=""; renderAsk(); break;
    case "aikey": aiCheckKey($("#ai-key").value); break;
    case "aioff": AI.key=null; AI.err=""; aiStore(); refreshAiBox(); render(); toast("Key removed from this device."); break;
    case "askadd": askAdd(); break;
    case "exitfocus": closeFocus(); break;
    case "tm": startTimer(parseInt(a.getAttribute("data-m"),10)); break;
    case "fdone": var ct=curTask(); if(ct){ ct.done=true; ct.doneAt=Date.now(); ct.inbox=false; save(); stopTimer(); STUCK={busy:false,steps:[],err:"",ctl:null}; F.i++; renderFocus(); } break;
    case "fskip": var cs=curTask(); if(cs){ F.q.push(F.q.splice(F.i,1)[0]); stopTimer(); STUCK={busy:false,steps:[],err:"",ctl:null}; renderFocus(); } break;
    case "fsmall":
      $("#smallbox").innerHTML='<div class="smaller"><input id="smallin" placeholder="What is the very first step?" aria-label="First step"><button class="btn primary" data-act="fsmalladd">Add</button></div>';
      $("#smallin").focus(); break;
    case "fsmalladd":
      var big=curTask(), txt=$("#smallin").value.trim();
      if(big&&txt){
        var s=mkTask({title:txt,project:big.project,tags:(big.tags||[]).slice(),energy:big.energy,plan:todayStr(),order:big.order-1});
        S.tasks.push(s); save(); F.q.splice(F.i,0,s.id); stopTimer(); renderFocus();
      }
      break;
    case "stuck": stuckGo(); break;
    case "stuckstop": if(STUCK.ctl){try{STUCK.ctl.abort()}catch(e){}} STUCK.busy=false; renderStuck(); break;
    case "stuckadd": stuckAdd(); break;
    case "stuckno": STUCK={busy:false,steps:[],err:"",ctl:null}; renderStuck(); break;
  }
});
document.addEventListener("change",function(ev){
  var i=ev.target.getAttribute&&ev.target.getAttribute("data-ai");
  if(i!==null&&i!==undefined&&ASK.items[+i]){
    ASK.items[+i].on=ev.target.checked;
    var b=document.querySelector('[data-act="askadd"]'), on=ASK.items.filter(function(x){return x.on}).length;
    if(b) b.textContent="Add "+on+" "+(on===1?"item":"items");
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.target.id==="cap"&&ev.key==="Enter"&&!ev.shiftKey){
    ev.preventDefault(); var c=ev.target; if(addFromText(c.value)){ var c2=$("#cap"); if(c2){ c2.value=""; c2.style.height=""; c2.focus(); } }
  }else if(ev.target.id==="ask-in"&&ev.key==="Enter"&&!ev.shiftKey&&!ev.isComposing){ ev.preventDefault(); inboxSave(); }
  else if(ev.target.id==="smallin"&&ev.key==="Enter"){ ev.preventDefault(); var b2=document.querySelector('[data-act="fsmalladd"]'); if(b2) b2.click(); }
  else if(ev.key==="Escape"){
    if($("#veil").classList.contains("show")) closeSheet();
    else if($("#focus").classList.contains("show")) closeFocus();
    else if(view==="cal"&&CAL.add){ CAL.add=null; render(); }
  }
  else if(ev.key==="n"&&!/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)&&!$("#veil").classList.contains("show")){
    var box=$("#cap")||$("#ask-in"); if(box){ ev.preventDefault(); box.focus(); }
  }
});
/* Drag a task onto a day (or Anytime / Later) in Calendar. Mouse, trackpad, and iPad touch-and-hold. */
var dragId=null;
document.addEventListener("dragstart",function(ev){
  var li=ev.target.closest&&ev.target.closest('li.task[draggable="true"]'); if(!li) return;
  dragId=li.getAttribute("data-id");
  try{ ev.dataTransfer.setData("text/plain",dragId); ev.dataTransfer.effectAllowed="move"; }catch(e){}
});
document.addEventListener("dragover",function(ev){
  var z=dragId&&ev.target.closest&&ev.target.closest("[data-drop]"); if(!z) return;
  ev.preventDefault();
  document.querySelectorAll(".over-drop").forEach(function(x){ if(x!==z) x.classList.remove("over-drop"); });
  z.classList.add("over-drop");
});
document.addEventListener("dragleave",function(ev){
  var z=ev.target.closest&&ev.target.closest("[data-drop]");
  if(z&&!z.contains(ev.relatedTarget)) z.classList.remove("over-drop");
});
document.addEventListener("drop",function(ev){
  var z=dragId&&ev.target.closest&&ev.target.closest("[data-drop]"); if(!z) return;
  ev.preventDefault(); var id=dragId; dragId=null;
  moveTask(id,z.getAttribute("data-drop"));
});
document.addEventListener("dragend",function(){ dragId=null; document.querySelectorAll(".over-drop").forEach(function(x){x.classList.remove("over-drop")}); });
/* Capture hint: shown while the box has focus. When focus leaves because of a press elsewhere,
   hide it only after that press finishes, so the list does not jump up under the pointer mid-click. */
var pressing=false, hintHide=false;
function setHint(on){ var w=$(".capwrap"); if(w) w.classList.toggle("hinting",on); }
document.addEventListener("pointerdown",function(){ pressing=true; },true);
function endPress(){ pressing=false; if(hintHide){ hintHide=false; setTimeout(function(){ if(document.activeElement!==$("#cap")) setHint(false); },80); } }
document.addEventListener("pointerup",endPress,true);
document.addEventListener("pointercancel",endPress,true);
document.addEventListener("focusin",function(ev){ if(ev.target.id==="cap"){ hintHide=false; setHint(true); } });
document.addEventListener("focusout",function(ev){ if(ev.target.id==="cap"){ if(pressing) hintHide=true; else setHint(false); } });
document.addEventListener("input",function(ev){
  if(ev.target.id==="cap"){ ev.target.style.height="auto"; ev.target.style.height=Math.min(ev.target.scrollHeight,160)+"px"; }
  if(ev.target.id==="ask-in") ASK.text=ev.target.value;
});

/* Opened from the 5 PM alert (./?wrap=1): show Today with the end-of-day offer. */
try{
  if(/[?&]wrap=1\b/.test(location.search)){ WRAP.force=true; view="today"; history.replaceState(null,"",location.pathname); }
  if(navigator.serviceWorker) navigator.serviceWorker.addEventListener("message",function(ev){
    var u=ev.data&&ev.data.open; if(!u) return;
    if(/wrap=1/.test(u)){ WRAP.force=true; view="today"; }
    render();
  });
}catch(e){}
ghLoad();
aiLoad();
if(window.claude){ GH.cfg=null; AI.key=null; }   /* inside claude.ai the db and sample capabilities are used instead */
loadLocal();
render();
initSync();
/* Installed app: offline cache. Skipped inside claude.ai (iframe) and on file://. */
try{
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&window.top===window.self&&!window.claude){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
}catch(e){}
/* Coming back to the app on a new day: refresh Today. */
var lastDay=todayStr();
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){
    if(todayStr()!==lastDay){ lastDay=todayStr(); if(planDay<lastDay) planDay=addDays(1); render(); }
    ghSync();
  }else if(GH.timer){ ghSync(); }   /* leaving the app with unsent changes: send them now */
});
/* GitHub sync: on open, when back online, and every minute while the app is on screen. */
ghSync();
checkReminders();
setInterval(checkReminders,20000);
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") checkReminders(); });
window.addEventListener("online",function(){ ghSync(); });
setInterval(function(){ if(document.visibilityState==="visible") ghSync(); },60000);
window.__app={get state(){return S},render:render,setView:function(v){view=v;render()},sync:ghSync};
})();
</script>
