name = "one-thing-push"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
GH_REPO = "cfmartin2025-collab/one-thing-data"
APP_ORIGIN = "https://cfmartin2025-collab.github.io"

# Filled in by tools/deploy-push.ps1 on first deploy.
[[kv_namespaces]]
binding = "OT"
id = "REPLACE_WITH_KV_ID"

# Every minute: send what is due.
[triggers]
crons = ["* * * * *"]

# Secrets (set by tools/deploy-push.ps1, never in this file):
#   VAPID_PUBLIC   base64url public key
#   VAPID_PRIVATE  private key as JWK JSON
